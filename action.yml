name: secretscan
description: Scan a repository's full git history for hardcoded secrets
branding:
  icon: lock
  color: red

inputs:
  path:
    description: Repository path to scan
    default: "."
  args:
    description: Extra arguments, e.g. "--baseline baseline.json"
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install secretscan
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Scan history
      shell: bash
      # Inputs go through env vars, not ${{ }} inside the script, so a
      # crafted input can't inject shell commands.
      env:
        SCAN_PATH: ${{ inputs.path }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        if [ "$(git -C "$SCAN_PATH" rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow clone: only part of the history is scanned. Use actions/checkout with fetch-depth: 0."
        fi
        # EXTRA_ARGS is intentionally unquoted so it splits into arguments.
        secretscan scan "$SCAN_PATH" $EXTRA_ARGS